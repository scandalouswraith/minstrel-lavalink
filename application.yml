
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      http: true
      local: false

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
    - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.1.0"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - ANDROID_VR
      - ANDROID_MUSIC
      - IOS
      - MWEB
      - WEB
      - MUSIC
      - WEBEMBEDDED
      - TV

  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      youtube: false
    lyrics-sources:
      spotify: true
      youtube: true
      lrcLib: true
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      customTokenEndpoint: "http://spotify-tokener.railway.internal:8080/api/token"
      countryCode: "US"
      playlistLoadLimit: 3
      albumLoadLimit: 2

  lavalyrics:
    sources:
      - spotify
      - youtube
      - deezer

logging:
  level:
    root: INFO
    dev.lavalink.youtube: DEBUG
    com.sedmelluq.discord.lavaplayer.tools.ExceptionTools: DEBUG
